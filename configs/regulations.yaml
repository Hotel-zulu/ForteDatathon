# Справочник «тип нарушения → норматив».
# ПРАВИЛО: в ответ сервиса попадают ТОЛЬКО ссылки из этого файла. Модель ссылки не придумывает
# (критерий 4 — «отсутствие выдуманных ссылок»).
#
# ⚠ Перед сдачей каждую цитату сверить с актуальной редакцией на adilet.zan.kz
#   и поставить verified: true. Пункты ниже собраны по редакциям на zakon.uchet.kz.
#
# Типы с enabled: false — гипотезы. Включайте после того, как команда подтвердит их
# на роликах (см. docs/ANNOTATION.md).

sources:
  nbrk_231:
    title: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей
      в банках второго уровня, филиалах банков-нерезидентов РК, Национальном операторе почты и
      юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    act: Постановление Правления НБРК от 29 ноября 2019 года № 231 (рег. № 19680)
    url: https://adilet.zan.kz/rus/docs/V1900019680
  nbrk_14:
    title: >-
      Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов РК,
      Национального оператора почты, инкассаторских организаций и обменных пунктов
    act: Постановление Правления НБРК от 24 февраля 2020 года № 14 (рег. № 20075)
    url: https://adilet.zan.kz/rus/docs/V2000020075

violation_types:
  leaving_workplace:
    name: Кассир покинул рабочее место во время обслуживания клиента
    enabled: false
    source: nbrk_231
    clause: п. 22
    quote: кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента
    observable: кассир выходит из зоны рабочего места, когда у окна находится клиент / операция не завершена
    verified: false

  count_not_in_client_view:
    name: Пересчёт наличных не в присутствии клиента
    enabled: false
    source: nbrk_231
    clause: п. 20, п. 31
    quote: наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента
    observable: пересчёт денег вне зоны видимости клиента (ниже стойки, отвернувшись, в отсутствие клиента)
    verified: false

  phone_in_cash_area:
    name: Средство связи с фото/видеофиксацией в кассовом узле
    enabled: false
    source: nbrk_231
    clause: п. 12
    quote: >-
      допускается внос в кассовый узел средств связи, не имеющих функции фото и видео фиксации
    observable: кассир держит / использует смартфон на рабочем месте
    verified: false

  personal_items_or_cash:
    name: Личные вещи / личные наличные работника в кассовом узле
    enabled: false
    source: nbrk_231
    clause: п. 12
    quote: личные вещи, наличные деньги и ценности работников хранятся вне кассового узла
    observable: сумка, кошелёк, личные деньги на рабочем месте кассира
    verified: false

  cash_left_unsecured:
    name: Наличные оставлены без присмотра / не убраны в запираемое хранилище
    enabled: false
    source: nbrk_231
    clause: п. 20
    quote: ранее принятые наличные хранятся в устройствах, закрывающихся на ключ
    observable: деньги лежат открыто на столе, ящик открыт, кассира нет на месте
    verified: false

  collection_bag_not_checked:
    name: Сумка инкассатора принята без проверки целостности и пломбы
    enabled: false
    source: nbrk_231
    clause: п. 24, п. 25
    quote: >-
      при приёме от инкассаторов кассовый работник проверяет целостность сумки и правильность пломбирования
    observable: сумка принята / вскрыта без визуального осмотра; вскрытие без инкассатора
    verified: false

  unauthorized_person:
    name: Посторонний в кассовом помещении
    enabled: false
    source: nbrk_231
    clause: п. 75
    quote: >-
      в кладовую и сейфовую комнату входят ответственные лица, иные лица — по распоряжению руководителя
      при сопровождении ответственных лиц
    observable: человек, не являющийся кассиром/инкассатором, находится за стойкой без сопровождения
    verified: false

  door_left_open:
    name: Дверь кассы не закрыта
    enabled: false
    source: nbrk_14
    clause: п. 16 подп. 1
    quote: каждая касса имеет отдельный вход с дверью, закрывающейся на замок
    observable: дверь кассы открыта во время операций с наличными
    verified: false
