# Справочник «тип нарушения → норматив».
# ПРАВИЛО: в ответ сервиса попадают ТОЛЬКО ссылки из этого файла. Модель ссылки не придумывает
# (критерий 4 — «отсутствие выдуманных ссылок»).
#
# Типы собраны по таблице команды (configs/violations_table.csv). Цитаты — дословные фрагменты
# действующих редакций (сверка 17.10.2026 по копии adilet на zakon.uchet.kz; №231 — ред. от 12.07.2026,
# №14 — ред. от 24.12.2024 (пост. №88), АРРФР №53 — от 03.04.2026). Перед сдачей ещё раз открыть
# adilet.zan.kz и сверить. verified: true — цитата сверена с текстом акта.
# videos — ролики из таблицы команды с этим нарушением (для проверки качества).
# enabled: false — детектор ещё не умеет / нет открытой нормы.

sources:
  nbrk_231:
    title: >-
      Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей
      в банках второго уровня, филиалах банков-нерезидентов Республики Казахстан, Национальном операторе почты
      и юридических лицах, исключительной деятельностью которых является инкассация банкнот, монет и ценностей
    act: Постановление Правления Национального Банка РК от 29 ноября 2019 года № 231
    url: https://adilet.zan.kz/rus/docs/V1900019680
  nbrk_14:
    title: >-
      Правила организации охраны и устройства помещений банков второго уровня, филиалов банков-нерезидентов
      Республики Казахстан, Национального оператора почты, инкассаторских организаций и обменных пунктов
    act: Постановление Правления Национального Банка РК от 24 февраля 2020 года № 14
    url: https://adilet.zan.kz/rus/docs/V2000020075
  aml_191:
    title: >-
      О противодействии легализации (отмыванию) доходов, полученных преступным путем, финансированию
      терроризма и финансированию распространения оружия массового уничтожения
    act: Закон Республики Казахстан от 28 августа 2009 года № 191-IV
    url: https://adilet.zan.kz/rus/docs/Z090000191_
  ardfm_53:
    title: >-
      Требования к обеспечению информационной безопасности банков, филиалов банков-нерезидентов
      Республики Казахстан и организаций, осуществляющих отдельные виды банковских операций
    act: Постановление Правления АРРФР от 3 апреля 2026 года № 53
    url: https://adilet.zan.kz/rus/docs/V2600038336

violation_types:
  cash_left_unsecured:
    name: Наличные деньги оставлены вне средства хранения
    enabled: true
    source: nbrk_231
    clause: п. 20
    quote: >-
      Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте
      кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег
      (металлический шкаф, сейф, тележка, ящики стола, тумба)
    observable: деньги лежат на столе после операции / при уходе кассира / при подходе следующего клиента
    videos: [X-1, X-4, X-26, X-38, X-47]
    verified: true

  safe_left_open:
    name: Средство хранения (сейф) оставлено открытым
    enabled: true
    source: nbrk_231
    clause: п. 20
    quote: >-
      Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте
      кассового работника, закрывающихся на ключ
    observable: дверца сейфа открыта, а кассир уже вернулся за стол / ушёл
    videos: [X-20]
    verified: true

  leaving_workplace:
    name: Кассир покинул рабочее место до окончания обслуживания
    enabled: true
    source: nbrk_231
    clause: п. 22
    quote: Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
    observable: кассир уходит из кассы, на столе остаются незавершённая операция (сумка инкассатора, ценности)
    videos: [X-15]
    verified: true

  workstation_unlocked:
    name: Рабочая станция оставлена без блокировки при уходе кассира
    enabled: true
    source: ardfm_53
    clause: п. 71 подп. 9)
    quote: >-
      при неактивности пользователя более 30 (тридцати) минут информационная система автоматически завершает
      сеанс работы пользователя либо блокирует рабочую станцию или ноутбук
    observable: кассир ушёл, экран ноутбука остаётся включённым и разблокированным
    note: >-
      Открытая норма требует только автоблокировку; требование блокировать экран при уходе — ВНД банка
      по ИБ. В описании это указывается прямо.
    videos: [X-11, X-28]
    verified: true

  no_client_identification:
    name: Операция проведена без идентификации клиента по документу
    enabled: true
    source: nbrk_231
    clause: п. 19 подп. 1), п. 31 подп. 1)
    quote: проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность
    observable: за время обслуживания клиент не предъявляет удостоверение личности кассиру
    extra_ref: >-
      Закон РК № 191-IV (ПОД/ФТ), ст. 5 п. 1: «Субъекты финансового мониторинга должны принимать меры
      по надлежащей проверке своих клиентов (их представителей)»
    videos: [X-2, X-17, X-18]
    verified: true

  cash_not_counted:
    name: Наличные приняты без полистного пересчёта
    enabled: false   # детектор пока ненадёжен (мало разметки) — см. docs/RULES.md
    source: nbrk_231
    clause: п. 19 подп. 2), п. 20
    quote: >-
      принимает банкноты с полистным пересчетом, монеты с пересчетом по кружкам; Наличные деньги принимаются
      и пересчитываются кассовым работником в присутствии клиента.
    observable: деньги убраны в сейф без пересчёта на счётчике / вручную
    videos: [X-13]
    verified: true

  no_authenticity_check:
    name: Банкноты приняты без проверки подлинности на оборудовании
    enabled: true    # пачка ни разу не проходит через зону счётчика; 0 ложных на 42 роликах и стресс-тестах
    source: nbrk_231
    clause: п. 19 подп. 2), п. 41
    quote: >-
      с проверкой на подлинность и платежность наличных денег; Банки осуществляют кассовые операции
      по пересчету и сортировке наличных денег на оборудовании
    observable: кассир считает деньги руками, счётчик банкнот (детектор) не используется
    videos: [X-44, X-46]
    verified: true

  key_left_in_lock:
    name: Ключ оставлен в замке средства хранения
    enabled: false   # нужен класс «ключ в замке» (команда размечает)
    source: nbrk_231
    clause: п. 80
    quote: >-
      Порядок хранения, выдачи и передачи ценностей, печатей, ключей … и ключей от специальных устройств,
      находящихся на рабочем месте кассового работника, предназначенных для хранения наличных денег
      (металлический шкаф, сейф, тележка, ящики стола), определяется внутренними документами банка,
      обеспечивающими исключение их несанкционированного использования.
    observable: ключ торчит в замке сейфа, кассир отошёл / ушёл
    videos: [X-22]
    verified: true

  door_left_open:
    name: Дверь кассы оставлена открытой
    enabled: true
    source: nbrk_14
    clause: п. 16 подп. 1), п. 8
    quote: >-
      каждая касса имеет отдельный вход с закрывающейся на замок дверью; кассовый узел изолирован
      … одним закрывающимся служебным входом
    observable: дверь в кассу остаётся открытой, пока кассир работает с наличными
    videos: [X-32, X-33]
    verified: true

  personal_items_in_cash_area:
    name: Личные вещи работника в кассовом узле
    enabled: true
    source: nbrk_231
    clause: п. 12
    quote: >-
      Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла
    observable: сумка / одежда / личные вещи на рабочем столе кассира
    videos: [X-40]
    verified: true

  third_party_document:
    name: Операция по документу, удостоверяющему личность, третьего лица
    enabled: true
    source: nbrk_231
    clause: п. 19 подп. 1), п. 31 подп. 1)
    quote: проводит визуальную идентификацию клиента по данным документа, удостоверяющего личность
    observable: >-
      у кассы трое; документ предъявляет/передаёт не обслуживаемый клиент (лица не распознаются — только
      кто передаёт документ)
    extra_ref: >-
      Закон РК № 191-IV (ПОД/ФТ), ст. 5 п. 1: «Субъекты финансового мониторинга должны принимать меры
      по надлежащей проверке своих клиентов (их представителей)»
    videos: [X-18]
    verified: true

  phone_in_cash_area:
    name: Средство связи с фото/видеофиксацией в кассовом узле
    enabled: false   # в таблице команды таких роликов нет; включать только при уверенной детекции
    source: nbrk_231
    clause: п. 12
    quote: >-
      Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств
      связи, не имеющих функции фото и видео фиксации.
    observable: кассир держит / использует смартфон на рабочем месте
    videos: []
    verified: true

  client_left_before_completion:
    name: Клиент ушёл до завершения кассовой операции
    enabled: false   # детектор в работе
    source: nbrk_231
    clause: п. 31 подп. 4)–6), п. 35
    quote: >-
      пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдает клиенту наличные
      деньги; Клиент пересчитывает полученные наличные деньги, не отходя от кассы
    observable: клиент выходит, пока деньги / документы ещё у кассира
    videos: [X-34]
    verified: true

  documents_left_open:
    name: Документы оставлены на столе при уходе кассира
    enabled: true
    source: ardfm_53
    clause: п. 76
    quote: Для защиты информации при использовании бумажных носителей применяются любой из следующих методов
    observable: бумаги / планшет остаются на столе, кассир ушёл
    note: открытая норма общая (защита бумажных носителей); политика «чистого стола» — ВНД банка
    videos: [X-24]
    verified: true

  clients_admitted_before_ready:
    name: Клиент допущен до готовности кассы к работе
    enabled: false   # открытую норму не нашли — не включать, пока не найдена
    source: nbrk_231
    clause: п. 22
    quote: Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента.
    observable: клиент входит, пока кассир ещё готовит рабочее место
    videos: [X-30]
    verified: false
